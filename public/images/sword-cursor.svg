<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Laser blade energy gradient -->
    <linearGradient id="bladeGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#4EFEB3"/>
      <stop offset="65%" stop-color="#00E575"/>
      <stop offset="100%" stop-color="#00A850"/>
    </linearGradient>
    <!-- Core white beam -->
    <linearGradient id="coreGrad" x1="4" y1="4" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#C7FFDE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4EFEB3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00FF88" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Saber Glow Layer -->
  <g filter="url(#glow)">
    <!-- Triangular Laser Blade -->
    <!-- Tip at (4,4), widening down-right towards hilt at (22, 16) and (16, 22) -->
    <polygon points="4,4 25,18 18,25" fill="url(#bladeGrad)" stroke="#00FF88" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Blade Inner Core -->
    <polygon points="5,5 23,19 19,23" fill="url(#coreGrad)"/>
    <!-- Central Energy Spine -->
    <line x1="4" y1="4" x2="21" y2="21" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Hilt Guard (Green Accents) -->
  <polygon points="17,24 24,17 26,19 28,21 21,28 19,26" fill="#00D26A" stroke="#0F172A" stroke-width="0.8"/>
  <polygon points="20,21 24,17 27,20 23,24" fill="#FFFFFF" opacity="0.9"/>

  <!-- Cylindrical Handle (White / Silver with Dark Grip Bands) -->
  <polygon points="23,26 26,23 37,34 34,37" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Grip Rings -->
  <line x1="26" y1="29" x2="29" y2="26" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="30" y1="33" x2="33" y2="30" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Pommel / Base with Green Cap -->
  <polygon points="35,38 38,35 43,40 40,43" fill="#00D26A" stroke="#0F172A" stroke-width="0.8"/>
  <polygon points="37,40 40,37 42,39 39,42" fill="#FFFFFF" opacity="0.8"/>
</svg>
